name: CorePrep CI/CD
on:
  push:
    branches: [main, branch1, branch2]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pip-audit
      - name: Lint backend
        run: ruff check backend/app --select E4,E7,E9,F63,F7,F82
      - name: Verify backend compilation
        run: python -m compileall -q backend/app
      - name: Run backend tests if present
        shell: bash
        run: |
          if [ -d backend/tests ]; then
            PYTHONPATH=backend pytest -q backend/tests
          else
            echo 'No backend/tests directory; test stage skipped.'
          fi
      - name: Install and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Frontend dependency security audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Backend dependency security audit
        run: pip-audit -r backend/requirements.txt
      - name: Package frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deployment
        env:
          RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_HOOK }}
        run: curl -fsS -X POST "$RENDER_BACKEND_HOOK"
      - name: Trigger Render frontend deployment
        env:
          RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_HOOK }}
        run: curl -fsS -X POST "$RENDER_FRONTEND_HOOK"
